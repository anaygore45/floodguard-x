version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodguard_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/models:/app/models
    environment:
      - DATABASE_PATH=/app/data/processed/floodguard_warehouse.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodguard_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
